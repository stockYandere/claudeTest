plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.claudetest'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.claudetest'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
