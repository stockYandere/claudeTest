plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.claudetest'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.claudetest'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // 빌드마다 같은 키로 서명해야 폰에서 기존 앱 위에 업데이트 설치가 된다.
    // 테스트용 디버그 키라 비밀번호는 안드로이드 기본값(android)을 쓴다.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
